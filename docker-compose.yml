services:
  api:
    image: amigo-secreto-api
    build:
      context: .
    env_file:
      - .env
    environment:
      # dentro da rede do Compose o banco e o servico "mongodb", nao localhost;
      # o .env continua valendo para quando a API roda no host
      DB_HOST: mongodb
    ports:
      - 3000:3000
    depends_on:
      - mongodb

  web:
    image: amigo-secreto-web
    build:
      context: ./web
    ports:
      # 8080 ja e usado por um Adminer de outro projeto desta maquina
      - 8090:80
    depends_on:
      - api

  mongodb:
    image: mongo:5.0
    volumes:
      # volume nomeado (gerenciado pelo Docker): o banco NAO fica dentro do repositorio
      # e sobrevive a `docker compose down`, restart e reboot da maquina.
      # Para apagar de vez: npm run db:destroy  (docker compose down -v)
      - mongo-data:/data/db
    ports:
      - 27017:27017

volumes:
  mongo-data:
