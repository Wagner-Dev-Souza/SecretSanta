services:
  api:
    image: amigo-secreto-api
    build:
      context: .
    env_file:
      - .env
    ports:
      - 3000:3000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:5.0
    volumes:
      # volume nomeado (gerenciado pelo Docker): o banco NAO fica dentro do repositorio
      # e sobrevive a `docker compose down`, restart e reboot da maquina.
      # Para apagar de vez: npm run db:destroy  (docker compose down -v)
      - mongo-data:/data/db
    ports:
      - 27017:27017

volumes:
  mongo-data:
