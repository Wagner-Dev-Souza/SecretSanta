server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/... vai para o container da API, sem o prefixo.
  # proxy_pass com variavel + resolver: o nginx sobe mesmo se a API ainda nao estiver
  # de pe (o DNS do Compose e resolvido por requisicao, nao na inicializacao).
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $servidor_api http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $servidor_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # o nginx nao conhece .webmanifest por padrao; tipo certo para o PWA
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # SPA: qualquer rota desconhecida cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
